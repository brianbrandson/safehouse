[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safehouse"
version = "0.1.0a0"
description = "Local-first Safehouse scaffolding CLI for pentest and lab work"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Safehouse maintainers"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
safehouse = "safehouse:main"

[tool.setuptools]
py-modules = ["safehouse"]
